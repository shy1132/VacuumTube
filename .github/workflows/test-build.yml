name: Verify macOS packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'scripts/verify-macos-packages.sh'
      - '.github/workflows/build-and-release.yml'
      - '.github/workflows/test-build.yml'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run mac:build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Ad-hoc signing uses no certificate or secret, including on fork PRs.
          CSC_FOR_PULL_REQUEST: 'true'
      - run: bash scripts/verify-macos-packages.sh

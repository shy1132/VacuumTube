name: Test builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --mac zip --x64 --arm64 -c.mac.identity=-
          - os: ubuntu-latest
            name: Linux
            args: --linux AppImage tar.gz --x64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build test packages (ad-hoc signed on macOS)
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS signatures after extracting the distributable ZIPs
        if: runner.os == 'macOS'
        run: |
          for arch in arm64 x64; do
            extracted="$RUNNER_TEMP/verify-$arch"
            ditto -x -k "dist/VacuumTube-$arch.zip" "$extracted"
            codesign --verify --deep --strict --verbose=2 "$extracted/VacuumTube.app"
            lipo "$extracted/VacuumTube.app/Contents/MacOS/VacuumTube" -verify_arch "${arch/x64/x86_64}"
          done
      - name: Include checksums and installation instructions
        shell: bash
        run: |
          cp docs/testing-copy-video-link.md dist/TESTING.md
          cd dist
          shopt -s nullglob
          shasum -a 256 *.zip *.AppImage *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: VacuumTube-test-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/TESTING.md
          if-no-files-found: error
          retention-days: 14
